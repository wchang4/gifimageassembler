<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF Batch Assembler</title>
<style>
  :root{
    --bg: #13161b;
    --surface: #1b2027;
    --surface-2: #232933;
    --surface-3: #2b323d;
    --field-bg: #262d37;
    --text: #f1f3f6;
    --text-dim: #9aa5b1;
    --text-faint: #6d7684;
    --accent: #e8a33d;
    --accent-soft: rgba(232,163,61,.16);
    --good: #5fbf82;
    --good-soft: rgba(95,191,130,.16);
    --warn: #e8a33d;
    --warn-soft: rgba(232,163,61,.16);
    --bad: #e0685a;
    --bad-soft: rgba(224,104,90,.16);
    --mono: "SF Mono", "Roboto Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    --shadow-card: 0 12px 28px -10px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.3);
    --shadow-sm: 0 2px 8px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.5;
    padding:32px 24px 80px;
  }
  .wrap{max-width:1040px;margin:0 auto;}

  header{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.06);}
  header .eyebrow{
    font-family:var(--sans);
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  header h1{margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:-.015em;}
  header p{margin:0;color:var(--text-dim);max-width:640px;}

  .panel{
    background:var(--surface);
    border:none;
    box-shadow:var(--shadow-card);
    border-radius:16px;
    padding:22px 24px;
    margin-bottom:20px;
  }
  .panel h2{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--text-dim);
    margin:0 0 14px;
    font-weight:700;
  }

  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .row + .row{margin-top:14px;}

  button{
    font-family:var(--sans);
    font-size:13.5px;
    font-weight:600;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.08);
    background:var(--surface-2);
    color:var(--text);
    padding:10px 18px;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .1s ease, background .12s ease, box-shadow .12s ease;
  }
  button:hover:not(:disabled){background:var(--surface-3);transform:translateY(-1px);}
  button:active:not(:disabled){transform:translateY(0);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{
    background:var(--accent);
    color:#211603;
    border-color:transparent;
  }
  button.primary:hover:not(:disabled){background:#f0ae4d;}
  button.ghost{background:transparent;box-shadow:none;}

  .status{font-family:var(--sans);font-size:13px;color:var(--text-dim);}
  .status.err{color:var(--bad);}

  .field, input[type="number"], select.field{
    background:var(--field-bg);
    border:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
    color:var(--text);
    border-radius:10px;
    padding:8px 10px;
    font-family:var(--sans);
    font-size:13px;
  }
  .field:focus, input[type="number"]:focus, select.field:focus{
    outline:none;
    box-shadow:0 0 0 2px var(--accent);
  }
  input[type="number"]{width:64px;}
  input.no-spin::-webkit-outer-spin-button,
  input.no-spin::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  input.no-spin{-moz-appearance:textfield;}
  .hint{color:var(--text-dim);font-size:12.5px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-dim);
    padding:0 10px 10px;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-weight:700;
  }
  tbody td{
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,.05);
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}

  .warn-list{display:flex;flex-direction:column;gap:6px;}
  .tag{
    display:inline-block;
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:500;
    padding:5px 11px;
    border-radius:8px;
